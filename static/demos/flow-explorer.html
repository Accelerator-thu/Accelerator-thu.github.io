<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A matrix is a velocity field</title>
<script>
// Follow the site's light/dark setting (shared localStorage key), else the system.
(function () {
  var t = null;
  try { t = localStorage.getItem("wc-color-theme"); } catch (e) {}
  if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
:root{
  /* Same tokens as twist-explorer.html and accelerator-thu.github.io */
  --paper:#F6F8FA; --ink:#1A2332; --dim:#56636B; --rule:#DDE3E5; --well:#EEF2F4; --card:#FFFFFF; --sub:#2F3A41;
  --w:#0F8A94; --warm:#D9682B; --field:#8A97A6; --grid:#E3E8EC; --axis:#C3CAD3;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: KaTeX_Math, 'Times New Roman', Georgia, serif;
  --mono: ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --paper:#0E141A; --ink:#E8ECF0; --dim:#A5B1B9; --rule:#2E3A42; --well:#18222B; --card:#151E26; --sub:#C9D3DA;
  --w:#4FB8C1; --warm:#F0955A; --field:#6F7D8A; --grid:#1C2730; --axis:#34424D;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100vh}
#view{position:relative;min-height:0;border-right:1px solid var(--rule)}
#view canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hint{position:absolute;left:12px;bottom:8px;font-size:12.5px;color:var(--dim);pointer-events:none}
.panel{overflow-y:auto;padding:18px 18px 28px}
h1{font-size:1.25rem;line-height:1.2;font-weight:700;margin:0 0 .35rem;letter-spacing:-.01em}
.lede{margin:0 0 .9rem;color:var(--sub);font-size:14px}
i.m{font-style:italic;font-family:var(--serif)}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--w);margin:1rem 0 .4rem}
.presets{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--w)}
button[aria-pressed="true"]{border-color:var(--w);color:var(--w);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--w);outline-offset:2px}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:.2rem 0}
.entry{display:grid;grid-template-columns:1.6em 1fr 3em;align-items:center;gap:6px;font-size:13px}
.entry output,.row output{font:12.5px var(--mono);text-align:right;color:var(--sub)}
input[type=range]{width:100%;accent-color:var(--w)}
.row{display:grid;grid-template-columns:auto 1fr 3.4em auto;gap:8px;align-items:center;margin:.3rem 0}
.toggle{display:flex;align-items:center;gap:7px;font-size:13px;margin:.35rem 0;color:var(--sub)}
.readout{font:12.5px/1.55 var(--mono);background:var(--well);border-radius:10px;padding:8px 10px;white-space:pre;overflow-x:auto}
.insight{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--w);border-radius:12px;padding:9px 12px;font-size:13.5px;margin:.8rem 0 0;color:var(--sub)}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--dim);margin-top:.5rem}
.sw{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
@media (max-width:720px){
  .app{display:block;height:auto}
  #view{height:min(92vw,440px);border-right:0;border-bottom:1px solid var(--rule)}
  .panel{padding:14px 14px 18px}
}
/* Embedded in the post column: controls and readouts side by side under the plot */
@media (min-width:540px) and (max-width:720px){
  .panel{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
  .panel .head{grid-column:1 / -1}
}
.toggle .mx{white-space:nowrap}
</style>
</head>
<body>
<main class="app">
  <div id="view">
    <canvas id="cv" aria-label="Velocity field x ↦ Xx with particles flowing along it, the orbit of a chosen point, and the image of the unit square under exp(tX)."></canvas>
    <div class="hint">Click or drag to move the point <i class="m">x</i><sub>0</sub>.</div>
  </div>
  <aside class="panel">
    <div class="head">
    <h1>A matrix is a velocity field</h1>
    <p class="lede">Each point <i class="m">x</i> moves with velocity <i class="m">Xx</i>. Following that rule for time <i class="m">t</i> is the linear map <i class="m">e</i><sup><i class="m">tX</i></sup>: the solution of <i class="m">ẋ</i> = <i class="m">Xx</i> is <i class="m">x</i>(<i class="m">t</i>) = <i class="m">e</i><sup><i class="m">tX</i></sup><i class="m">x</i><sub>0</sub>.</p>
    </div>

    <div class="col">
    <div class="label">Choose X</div>
    <div class="presets" id="presets"></div>

    <div class="label">Entries of X</div>
    <div class="matrix">
      <label class="entry"><span>x<sub>11</sub></span><input type="range" id="a" min="-2" max="2" step="0.05"><output id="ao"></output></label>
      <label class="entry"><span>x<sub>12</sub></span><input type="range" id="b" min="-2" max="2" step="0.05"><output id="bo"></output></label>
      <label class="entry"><span>x<sub>21</sub></span><input type="range" id="c" min="-2" max="2" step="0.05"><output id="co"></output></label>
      <label class="entry"><span>x<sub>22</sub></span><input type="range" id="d" min="-2" max="2" step="0.05"><output id="do"></output></label>
    </div>

    <div class="row">
      <span><i class="m">t</i></span>
      <input type="range" id="t" min="0" max="6.3" step="0.01" value="1">
      <output id="to"></output>
      <button id="play" type="button" aria-pressed="false">Play</button>
    </div>
    <label class="toggle"><input type="checkbox" id="showSq" checked> <span>Show <span class="mx"><i class="m">e</i><sup><i class="m">tX</i></sup></span> acting on the unit square</span></label>
    <label class="toggle"><input type="checkbox" id="showFlow" checked> Particles following the field</label>
    </div>

    <div class="col">
    <div class="label">What you are seeing</div>

    <div class="readout" id="readout" aria-live="polite"></div>
    <div class="insight" id="insight"></div>
    <div class="key">
      <span><span class="sw" style="background:var(--field)"></span>field <i class="m">Xx</i> (direction)</span>
      <span><span class="sw" style="background:var(--warm)"></span>orbit <i class="m">e</i><sup><i class="m">tX</i></sup><i class="m">x</i><sub>0</sub></span>
      <span><span class="sw" style="background:var(--w)"></span>velocity <i class="m">X x</i>(<i class="m">t</i>)</span>
    </div>
    </div>
  </aside>
</main>

<script>
(() => {
"use strict";
const css = getComputedStyle(document.documentElement);
const tok = (n) => css.getPropertyValue('--' + n).trim();
const C = { ink: tok('ink'), dim: tok('dim'), w: tok('w'), warm: tok('warm'), field: tok('field'), grid: tok('grid'), axis: tok('axis') };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Re-theme when the embedding page toggles its theme (same origin).
try {
  const parentRoot = window.parent !== window && window.parent.document.documentElement;
  if (parentRoot) new MutationObserver(() => {
    if (parentRoot.classList.contains('dark') !== (document.documentElement.dataset.theme === 'dark')) location.reload();
  }).observe(parentRoot, { attributes: true, attributeFilter: ['class'] });
} catch (e) { /* cross-origin embed */ }

// ---------- 2×2 linear algebra ----------
// Matrices are [a, b, c, d] for [[a, b], [c, d]].
const mul = (M, v) => [M[0] * v[0] + M[1] * v[1], M[2] * v[0] + M[3] * v[1]];
/** Exact exponential of a 2×2 matrix. Write M = τI + B with B traceless;
 *  B² = s²I with s² = −det B, so e^B = cosh(s)·I + sinh(s)/s·B (cos/sin when s² < 0). */
function expm(M) {
  const tau = (M[0] + M[3]) / 2;
  const B = [M[0] - tau, M[1], M[2], M[3] - tau];
  const s2 = -(B[0] * B[3] - B[1] * B[2]);
  let c, k; // e^B = c·I + k·B
  if (Math.abs(s2) < 1e-12) { c = 1; k = 1; }
  else if (s2 > 0) { const s = Math.sqrt(s2); c = Math.cosh(s); k = Math.sinh(s) / s; }
  else { const w = Math.sqrt(-s2); c = Math.cos(w); k = Math.sin(w) / w; }
  const e = Math.exp(tau);
  return [e * (c + k * B[0]), e * k * B[1], e * k * B[2], e * (c + k * B[3])];
}
const scale = (M, t) => M.map((x) => x * t);

// ---------- state ----------
const PRESETS = [
  { name: 'Rotation', X: [0, -1, 1, 0] },
  { name: 'Ellipses', X: [0, -2, 0.5, 0] },
  { name: 'Spiral', X: [-0.25, -1, 1, -0.25] },
  { name: 'Scaling', X: [0.5, 0, 0, 0.5] },
  { name: 'Saddle', X: [1, 0, 0, -1] },
  { name: 'Shear', X: [0, 1, 0, 0] },
];
const S = { X: PRESETS[0].X.slice(), t: 1, x0: [1.6, 0.4], playing: false, preset: 0 };
const $ = (id) => document.getElementById(id);
const ids = ['a', 'b', 'c', 'd'];

const presetBox = $('presets');
PRESETS.forEach((p, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = p.name;
  b.addEventListener('click', () => { S.X = p.X.slice(); S.preset = i; syncInputs(); resetParticles(); update(); });
  presetBox.appendChild(b);
});

function syncInputs() {
  ids.forEach((id, i) => { $(id).value = S.X[i]; });
  [...presetBox.children].forEach((b, i) => b.setAttribute('aria-pressed', String(i === S.preset)));
}
ids.forEach((id, i) => $(id).addEventListener('input', () => {
  S.X[i] = Number($(id).value);
  S.preset = PRESETS.findIndex((p) => p.X.every((v, j) => Math.abs(v - S.X[j]) < 1e-9));
  [...presetBox.children].forEach((b, j) => b.setAttribute('aria-pressed', String(j === S.preset)));
  update();
}));
$('t').addEventListener('input', () => { S.t = Number($('t').value); update(); });
$('showSq').addEventListener('change', () => draw());
$('showFlow').addEventListener('change', () => { resetParticles(); draw(); });
$('play').addEventListener('click', () => {
  S.playing = !S.playing;
  $('play').textContent = S.playing ? 'Pause' : 'Play';
  $('play').setAttribute('aria-pressed', String(S.playing));
});

// ---------- canvas & coordinates ----------
const cv = $('cv'), ctx = cv.getContext('2d');
const trail = document.createElement('canvas'), tctx = trail.getContext('2d');
const R = 3; // world window [-R, R]²
let W = 0, H = 0, dpr = 1, unit = 1, ox = 0, oy = 0;
function resize() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  for (const c of [cv, trail]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  unit = Math.min(W, H) / (2 * R); ox = W / 2; oy = H / 2;
  resetParticles(); draw();
}
const toScreen = (p) => [ox + p[0] * unit, oy - p[1] * unit];
const toWorld = (sx, sy) => [(sx - ox) / unit, (oy - sy) / unit];
const inView = (p) => Math.abs(p[0]) <= R * W / Math.min(W, H) + 0.2 && Math.abs(p[1]) <= R * H / Math.min(W, H) + 0.2;

function arrow(g, from, to, color, width, head = 7) {
  const [x1, y1] = toScreen(from), [x2, y2] = toScreen(to);
  const ang = Math.atan2(y2 - y1, x2 - x1), len = Math.hypot(x2 - x1, y2 - y1);
  if (len < 0.5) return;
  const h = Math.min(head, len * 0.45);
  g.strokeStyle = color; g.fillStyle = color; g.lineWidth = width; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2 - h * 0.6 * Math.cos(ang), y2 - h * 0.6 * Math.sin(ang)); g.stroke();
  g.beginPath(); g.moveTo(x2, y2);
  g.lineTo(x2 - h * Math.cos(ang - 0.42), y2 - h * Math.sin(ang - 0.42));
  g.lineTo(x2 - h * Math.cos(ang + 0.42), y2 - h * Math.sin(ang + 0.42));
  g.closePath(); g.fill();
}

// ---------- particles: advected exactly, x ← e^{δX} x ----------
let parts = [];
function spawn() {
  const ax = R * W / Math.min(W, H), ay = R * H / Math.min(W, H);
  return { p: [(Math.random() * 2 - 1) * ax, (Math.random() * 2 - 1) * ay], age: Math.random() * 120 };
}
function resetParticles() {
  const n = Math.round(Math.min(360, (W * H) / 900));
  parts = Array.from({ length: n }, spawn);
  tctx.clearRect(0, 0, W, H);
}
function stepParticles() {
  if (!W || !H) return;
  const E = expm(scale(S.X, 0.012));
  tctx.globalCompositeOperation = 'destination-out';
  tctx.fillStyle = 'rgba(0,0,0,0.07)'; tctx.fillRect(0, 0, W, H);
  tctx.globalCompositeOperation = 'source-over';
  tctx.strokeStyle = C.field; tctx.lineWidth = 1.3; tctx.globalAlpha = 0.75;
  tctx.beginPath();
  for (const q of parts) {
    const n = mul(E, q.p);
    const [x1, y1] = toScreen(q.p), [x2, y2] = toScreen(n);
    tctx.moveTo(x1, y1); tctx.lineTo(x2, y2);
    q.p = n; q.age += 1;
    if (!inView(n) || Math.hypot(n[0], n[1]) < 0.04 || q.age > 260) Object.assign(q, spawn(), { age: 0 });
  }
  tctx.stroke(); tctx.globalAlpha = 1;
}

// ---------- drawing ----------
function draw() {
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  // grid and axes
  const ax = Math.ceil(R * W / Math.min(W, H)), ay = Math.ceil(R * H / Math.min(W, H));
  ctx.lineWidth = 1; ctx.strokeStyle = C.grid; ctx.beginPath();
  for (let i = -ax; i <= ax; i++) { const [x] = toScreen([i, 0]); ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let j = -ay; j <= ay; j++) { const [, y] = toScreen([0, j]); ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  ctx.strokeStyle = C.axis; ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.stroke();

  if ($('showFlow').checked && !reduced && trail.width > 0 && trail.height > 0) ctx.drawImage(trail, 0, 0, W, H);

  // velocity field: direction everywhere, length ~ relative speed
  const step = 0.5, X = S.X;
  let vmax = 1e-9;
  for (let x = -ax; x <= ax; x += step) for (let y = -ay; y <= ay; y += step) vmax = Math.max(vmax, Math.hypot(...mul(X, [x, y])));
  for (let x = -ax; x <= ax + 1e-9; x += step) for (let y = -ay; y <= ay + 1e-9; y += step) {
    const v = mul(X, [x, y]), sp = Math.hypot(v[0], v[1]);
    if (sp < 1e-9) continue;
    const L = step * 0.8 * (0.35 + 0.65 * sp / vmax);
    ctx.globalAlpha = 0.45 + 0.4 * sp / vmax;
    arrow(ctx, [x - v[0] / sp * L / 2, y - v[1] / sp * L / 2], [x + v[0] / sp * L / 2, y + v[1] / sp * L / 2], C.field, 1.2, 5);
  }
  ctx.globalAlpha = 1;

  // e^{tX} acting on the unit square: columns are e^{tX}e1, e^{tX}e2
  const Et = expm(scale(X, S.t));
  if ($('showSq').checked) {
    const sq = [[0, 0], [1, 0], [1, 1], [0, 1]];
    ctx.setLineDash([4, 4]); ctx.strokeStyle = C.dim; ctx.lineWidth = 1.2; ctx.beginPath();
    sq.forEach((p, i) => { const [x, y] = toScreen(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.stroke();
    ctx.setLineDash([]);
    const img = sq.map((p) => mul(Et, p));
    ctx.fillStyle = C.w; ctx.globalAlpha = 0.12; ctx.beginPath();
    img.forEach((p, i) => { const [x, y] = toScreen(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = C.w; ctx.lineWidth = 1.6; ctx.stroke();
    arrow(ctx, [0, 0], img[1], C.ink, 1.8, 8); arrow(ctx, [0, 0], img[3], C.ink, 1.8, 8);
  }

  // orbit of x0: t ↦ e^{tX} x0 (solid up to the current t, faint beyond)
  const T = 6.3, N = 260;
  const pts = [];
  for (let k = 0; k <= N; k++) pts.push(mul(expm(scale(X, (T * k) / N)), S.x0));
  ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
  const kNow = Math.round((S.t / T) * N);
  for (const [from, to, alpha] of [[0, kNow, 1], [kNow, N, 0.3]]) {
    ctx.globalAlpha = alpha; ctx.strokeStyle = C.warm; ctx.beginPath();
    for (let k = from; k <= to; k++) { const [x, y] = toScreen(pts[k]); k === from ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // x0 (hollow) and x(t) (filled) with its velocity X x(t), tangent to the orbit
  const xt = mul(Et, S.x0), vt = mul(X, xt);
  const vs = Math.hypot(vt[0], vt[1]), vlen = Math.min(1, 0.5 * vs) / Math.max(vs, 1e-9);
  arrow(ctx, xt, [xt[0] + vt[0] * vlen, xt[1] + vt[1] * vlen], C.w, 2.6, 10);
  let [sx, sy] = toScreen(S.x0);
  ctx.lineWidth = 2; ctx.strokeStyle = C.warm; ctx.fillStyle = tok('paper');
  ctx.beginPath(); ctx.arc(sx, sy, 5.5, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
  [sx, sy] = toScreen(xt);
  ctx.fillStyle = C.warm; ctx.beginPath(); ctx.arc(sx, sy, 5.5, 0, 2 * Math.PI); ctx.fill();
  ctx.font = 'italic 15px "Times New Roman", serif'; ctx.fillStyle = C.ink;
  ctx.fillText('x(t)', sx + 8, sy - 8);
}

// ---------- readouts ----------
const f = (x) => (Math.abs(x) < 5e-5 ? 0 : x).toFixed(2).padStart(6);
function update() {
  ids.forEach((id, i) => { $(id + 'o').textContent = S.X[i].toFixed(2); });
  $('to').textContent = S.t.toFixed(2);
  const [a, b, c, d] = S.X, tr = a + d, det = a * d - b * c, disc = tr * tr / 4 - det;
  const Et = expm(scale(S.X, S.t));
  const detE = Et[0] * Et[3] - Et[1] * Et[2];
  const xt = mul(Et, S.x0);
  let eig;
  if (disc >= 0) eig = `${(tr / 2 + Math.sqrt(disc)).toFixed(2)}, ${(tr / 2 - Math.sqrt(disc)).toFixed(2)}`;
  else eig = `${(tr / 2).toFixed(2)} ± ${Math.sqrt(-disc).toFixed(2)}i`;
  $('readout').textContent =
    `X       = [${f(a)} ${f(b)} ]\n          [${f(c)} ${f(d)} ]\n` +
    `e^(tX)  = [${f(Et[0])} ${f(Et[1])} ]   t = ${S.t.toFixed(2)}\n          [${f(Et[2])} ${f(Et[3])} ]\n` +
    `eigenvalues of X: ${eig}\n` +
    `det e^(tX) = ${detE.toFixed(3)}  e^(t·tr X) = ${Math.exp(S.t * tr).toFixed(3)}\n` +
    `|x0| = ${Math.hypot(...S.x0).toFixed(3)}   |x(t)| = ${Math.hypot(...xt).toFixed(3)}`;
  $('insight').innerHTML = explain(a, b, c, d, tr, det, disc);
  draw();
}

function explain(a, b, c, d, tr, det, disc) {
  const eps = 1e-9, m = '<i class="m">', e = '</i>';
  const area = Math.abs(tr) < eps ? 'tr ' + m + 'X' + e + ' = 0, so the flow preserves area.'
    : tr > 0 ? 'tr ' + m + 'X' + e + ' &gt; 0, so areas grow like ' + m + 'e' + e + '<sup>' + m + 't' + e + '·tr ' + m + 'X' + e + '</sup>.'
    : 'tr ' + m + 'X' + e + ' &lt; 0, so areas shrink like ' + m + 'e' + e + '<sup>' + m + 't' + e + '·tr ' + m + 'X' + e + '</sup>.';
  if ([a, b, c, d].every((v) => Math.abs(v) < eps)) return 'With ' + m + 'X' + e + ' = 0 nothing moves: ' + m + 'e' + e + '<sup>0</sup> = ' + m + 'I' + e + '.';
  if (Math.abs(a) < eps && Math.abs(d) < eps && Math.abs(b + c) < eps)
    return '<b>Skew-symmetric.</b> Every velocity ' + m + 'Xx' + e + ' is perpendicular to ' + m + 'x' + e +
      ', so lengths never change (watch |' + m + 'x' + e + '(' + m + 't' + e + ')|) and ' + m + 'e' + e + '<sup>' + m + 'tX' + e +
      '</sup> is a rotation by angle ' + (c).toFixed(2) + m + 't' + e + '. This is the 2×2 case of “velocities of rotations are skew-symmetric”.';
  if (Math.abs(b) < eps && Math.abs(c) < eps && Math.abs(a - d) < eps)
    return '<b>A multiple of the identity.</b> The velocity points straight away from (or toward) the origin, and ' + m + 'e' + e + '<sup>' + m + 'tX' + e + '</sup> = ' + m + 'e' + e + '<sup>' + a.toFixed(2) + m + 't' + e + '</sup>' + m + 'I' + e + ': compound interest in every direction at once.';
  if (Math.abs(tr) < eps && Math.abs(det) < eps)
    return '<b>Nilpotent.</b> ' + m + 'X' + e + '² = 0, so the series stops after two terms: ' + m + 'e' + e + '<sup>' + m + 'tX' + e + '</sup> = ' + m + 'I' + e + ' + ' + m + 'tX' + e + '. The flow is a shear, and lines parallel to the fixed direction slide past each other.';
  if (disc < -eps && Math.abs(tr) < eps)
    return '<b>Closed orbits, but not a rotation.</b> The eigenvalues are purely imaginary, so every point returns after time 2π/' + Math.sqrt(-disc).toFixed(2) +
      '. The orbits are ellipses: lengths change, so ' + m + 'e' + e + '<sup>' + m + 'tX' + e + '</sup> is not a rotation, because ' + m + 'X' + e + ' is not skew-symmetric. ' + area;
  if (disc < -eps)
    return '<b>Spiral.</b> Complex eigenvalues ' + (tr / 2).toFixed(2) + ' ± ' + Math.sqrt(-disc).toFixed(2) + m + 'i' + e + ': the imaginary part turns, the real part ' +
      (tr < 0 ? 'pulls every point in toward the origin.' : 'pushes every point out.') + ' ' + area;
  if (det < -eps)
    return '<b>Saddle.</b> Real eigenvalues of opposite sign: the flow stretches along one eigenvector and squeezes along the other. ' + area;
  if (Math.abs(det) < eps)
    return '<b>One eigenvalue is zero.</b> Points on its eigenvector line have zero velocity and never move; every other point slides parallel to the other eigenvector, growing or decaying like ' + m + 'e' + e + '<sup>' + tr.toFixed(2) + m + 't' + e + '</sup>. ' + area;
  return tr < 0
    ? '<b>Sink.</b> Real negative eigenvalues: along each eigenvector the motion is plain exponential decay, and orbits enter the origin tangent to the slower (smaller |λ|) eigenvector. ' + area
    : '<b>Source.</b> Real positive eigenvalues: along each eigenvector the motion is plain exponential growth; orbits leave the origin tangent to the slower eigenvector and straighten out along the faster one. ' + area;
}

// ---------- interaction ----------
let dragging = false;
function setX0(e) {
  const r = cv.getBoundingClientRect();
  S.x0 = toWorld(e.clientX - r.left, e.clientY - r.top); update();
}
cv.addEventListener('pointerdown', (e) => { dragging = true; cv.setPointerCapture(e.pointerId); setX0(e); });
cv.addEventListener('pointermove', (e) => { if (dragging) setX0(e); });
cv.addEventListener('pointerup', () => { dragging = false; });
cv.addEventListener('pointercancel', () => { dragging = false; });
new ResizeObserver(resize).observe($('view'));

// When embedded (same origin) and stacked, size the iframe to the content so the
// post never shows a scrollbar inside the frame. Side by side, the app is 100vh.
const stacked = matchMedia('(max-width: 720px)');
function fitFrame() {
  let fe = null;
  try { fe = window.frameElement; } catch (e) { return; }
  if (!fe || !stacked.matches) return;
  const h = Math.ceil(document.querySelector('.app').getBoundingClientRect().height) + 2; // +2: no sub-pixel scrollbar
  if (Math.abs(fe.getBoundingClientRect().height - h) > 1) fe.style.height = h + 'px';
}
new ResizeObserver(fitFrame).observe(document.querySelector('.app'));
stacked.addEventListener?.('change', fitFrame);

// ---------- animation loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let dirty = false;
  if (S.playing) {
    S.t += dt * 0.8; if (S.t > 6.3) S.t = 0;
    $('t').value = S.t; dirty = true;
  }
  if ($('showFlow').checked && !reduced) { stepParticles(); dirty = true; }
  if (dirty) { if (S.playing) update(); else draw(); }
  requestAnimationFrame(frame);
}
syncInputs(); resize(); update();
requestAnimationFrame(frame);
})();
</script>
